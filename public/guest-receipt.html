<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Receipt</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&family=Inter%3Awght%40400%3B500%3B700%3B900&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />
</head>
<body style='font-family: Inter, "Noto Sans", sans-serif;'>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-slate-50 justify-between group/design-root overflow-x-hidden"
    >
      <div>
        <div class="flex items-center bg-slate-50 p-4 pb-2 justify-between">
          <a href="#" id="back-button" class="text-[#0d141b] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
          </a>
          <h2 class="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Guest Receipt</h2>
        </div>
        
        <div class="px-4 py-6">
          <div class="bg-white rounded-lg border border-[#cfdbe7] p-6 mb-4">
            <div class="text-center mb-6">
              <h3 class="text-xl font-bold text-[#0d141b] mb-2">Guest Consumption Receipt</h3>
              <p class="text-sm text-[#4c739a]" id="room-info">Room: </p>
              <p class="text-sm text-[#4c739a]" id="receipt-date">Date: </p>
            </div>
            
            <div class="mb-6">
              <h4 class="font-semibold text-[#0d141b] mb-3">Consumed Items:</h4>
              <div id="receipt-items" class="space-y-2">
                <!-- Receipt items will be rendered here -->
              </div>
            </div>
            
            <div class="border-t border-[#cfdbe7] pt-4">
              <div class="flex justify-between items-center">
                <span class="text-lg font-bold text-[#0d141b]">Total:</span>
                <span class="text-xl font-bold text-[#0d141b]" id="total-amount">$0.00</span>
              </div>
            </div>
          </div>
          
          <!-- Replenishment section will be shown here -->
          <div id="replenishment-section" class="mt-6">
            <!-- Replenishment items will be rendered here -->
          </div>
        </div>
      </div>
      
      <!-- Bottom navigation (fixed) -->
      <div class="fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-gray-200">
        <div class="grid h-full max-w-lg grid-cols-4 mx-auto font-medium">
          <a href="rooms.html" class="inline-flex flex-col items-center justify-center px-5 border-gray-200 border-x hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0l.11.11,80,75.48A16,16,0,0,1,224,115.55Z"></path>
            </svg>
            <span class="text-xs text-gray-500 group-hover:text-blue-600" data-translate="navRooms">Rooms</span>
          </a>
          <a href="dashboard.html" class="inline-flex flex-col items-center justify-center px-5 border-r border-gray-200 hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M216,40H136V24a8,8,0,0,0-16,0V40H40A16,16,0,0,0,24,56V176a16,16,0,0,0,16,16H79.36L57.75,219a8,8,0,0,0,12.5,10l29.59-37h56.32l29.59,37a8,8,0,1,0,12.5-10l-21.61-27H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Z"></path>
            </svg>
            <span class="text-xs text-gray-500 group-hover:text-blue-600" data-translate="navDashboard">Dashboard</span>
          </a>
          <a href="activity.html" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216Z"></path>
            </svg>
            <span class="text-xs text-blue-600 font-semibold" data-translate="navActivity">Activity</span>
          </a>
          <a href="profile.html" class="inline-flex flex-col items-center justify-center px-5 border-gray-200 border-x hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path>
            </svg>
            <span class="text-xs text-gray-500 group-hover:text-blue-600" data-translate="navProfile">Profile</span>
          </a>
        </div>
      </div>
    </div>
    
    <script type="module" src="js/guest-receipt.js"></script>
    <script type="module" src="js/translations.js"></script>
</body>
</html>
