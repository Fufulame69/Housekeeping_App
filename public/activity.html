<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minibar Inventory - Activity</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />
</head>
<body style='font-family: Inter, "Noto Sans", sans-serif;'>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-slate-50 justify-between group/design-root overflow-x-hidden"
    >
      <div>
        <div class="flex items-center bg-slate-50 p-4 pb-2 justify-between">
          <div class="text-[#0d141b] flex size-12 shrink-0 items-center" data-icon="List" data-size="24px" data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
              <path
                d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"
              ></path>
            </svg>
          </div>
          <h2 class="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12" data-translate="navActivity">Activity</h2>
        </div>
        <!-- Date Picker Section -->
        <div class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-10">
            <div class="flex items-center justify-between">
                <button id="prev-date" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path>
                    </svg>
                </button>
                
                <div class="flex flex-col items-center">
                    <h2 class="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em]">Receipts</h2>
                    <div id="selected-date" class="text-[#4c739a] text-sm font-medium"></div>
                </div>
                
                <button id="next-date" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M90.34,53.66a8,8,0,0,0-11.32,11.32L128.69,128,79,177.66a8,8,0,0,0,11.32,11.32l56-56a8,8,0,0,0,0-11.32Z"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Quick date selection buttons -->
            <div class="flex justify-center gap-2 mt-3">
                <button id="calendar-btn" class="px-3 py-1 text-xs font-medium text-gray-600 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="12px" height="12px" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Z"></path>
                    </svg>
                    Calendar
                </button>
            </div>
            
            <!-- Date picker (hidden by default) -->
            <div id="date-picker-container" class="hidden mt-3">
                <input type="date" id="date-picker" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        
        <!-- Submissions container -->
        <div id="date-submissions" class="px-4 pt-4">
            <!-- Submissions for selected date will be rendered here -->
        </div>
      </div>
      <!-- Bottom navigation (fixed) -->
      <div class="fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-gray-200">
        <div class="grid h-full max-w-lg grid-cols-4 mx-auto font-medium">
          <a href="rooms.html" class="inline-flex flex-col items-center justify-center px-5 border-gray-200 border-x hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0l.11.11,80,75.48A16,16,0,0,1,224,115.55Z"></path>
            </svg>
            <span class="text-xs text-gray-500 group-hover:text-blue-600" data-translate="navRooms">Rooms</span>
          </a>
          <a href="dashboard.html" class="inline-flex flex-col items-center justify-center px-5 border-r border-gray-200 hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M216,40H136V24a8,8,0,0,0-16,0V40H40A16,16,0,0,0,24,56V176a16,16,0,0,0,16,16H79.36L57.75,219a8,8,0,0,0,12.5,10l29.59-37h56.32l29.59,37a8,8,0,1,0,12.5-10l-21.61-27H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Z"></path>
            </svg>
            <span class="text-xs text-gray-500 group-hover:text-blue-600" data-translate="navDashboard">Dashboard</span>
          </a>
          <a href="activity.html" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216Z"></path>
            </svg>
            <span class="text-xs text-blue-600 font-semibold" data-translate="navActivity">Activity</span>
          </a>
          <a href="profile.html" class="inline-flex flex-col items-center justify-center px-5 border-gray-200 border-x hover:bg-gray-50 group">
            <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
              <path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path>
            </svg>
            <span class="text-xs text-gray-500 group-hover:text-blue-600" data-translate="navProfile">Profile</span>
          </a>
        </div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/activity.js"></script>
    <script type="module" src="js/translations.js"></script>
</body>
</html>
